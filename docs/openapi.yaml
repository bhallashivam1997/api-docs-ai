openapi: 3.1.0
info:
  title: api-docs-ai
  version: 1.0.0
  description: "Small Express REST API for a demo: health check and in-memory users."
servers:
  - url: http://localhost:3000
    description: Local server (default PORT in src/server.js)
tags:
  - name: health
  - name: users
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check application health
      description: Returns the operational status of the application. This operation takes no parameters and reads no request body.
      tags:
        - health
      responses:
        "200":
          description: The application is operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
                additionalProperties: false
              example:
                status: ok
  /users:
    post:
      operationId: createUser
      summary: Create a user
      description: Creates a new user with the provided name, email, role, and age. The request must contain valid string fields for `name` and `email`, and must not contain any unknown fields or an email already in use.
      tags:
        - users
      requestBody:
        required: true
        description: User details for creating a new user account.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  maxLength: 254
                role:
                  type: string
                  enum:
                    - admin
                    - member
                  default: member
                age:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 150
                  default: null
              required:
                - name
                - email
              additionalProperties: false
            example:
              name: Alex Mercer
              email: alex.mercer@example.com
              role: member
              age: 28
      responses:
        "201":
          description: The user was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - admin
                      - member
                  age:
                    type:
                      - integer
                      - "null"
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - email
                  - role
                  - age
                  - createdAt
                additionalProperties: false
              example:
                id: a1b2c3d4-e5f6-4a5b-8c7d-9e8f7a6b5c4d
                name: Alex Mercer
                email: alex.mercer@example.com
                role: member
                age: 28
                createdAt: 2026-03-30T12:00:00.000Z
        "400":
          description: The request body is missing, not valid JSON, contains unknown fields, or has invalid field values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: invalid_input
                  message: name is required and must be a string
        "409":
          description: A user with the specified email address already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: email_taken
                  message: A user with this email already exists
  /users/{id}:
    get:
      operationId: getUser
      summary: Retrieve a user by ID
      description: Retrieves details for an existing user by ID. Returns a 404 error if no user exists with the specified ID.
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user to retrieve.
          schema:
            type: string
          example: a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
      responses:
        "200":
          description: The user with the specified ID was found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - admin
                      - member
                  age:
                    type:
                      - integer
                      - "null"
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - email
                  - role
                  - age
                  - createdAt
                additionalProperties: false
              example:
                id: a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
                name: Alice Smith
                email: alice@example.com
                role: member
                age: 30
                createdAt: 2026-03-15T10:00:00.000Z
        "404":
          description: No user exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        const: not_found
                      message:
                        type: string
                        const: User not found
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: not_found
                  message: User not found
